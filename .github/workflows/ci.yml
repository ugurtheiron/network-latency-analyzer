name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdpdk-dev meson ninja-build pkg-config build-essential

      - name: Configure
        run: meson setup build

      - name: Build
        run: meson compile -C build

      - name: Configure test project
        run: meson setup build-test test

      - name: Build test project
        run: meson compile -C build-test

      - name: Configure test2 project
        run: meson setup build-test2 test2

      - name: Build test2 project
        run: meson compile -C build-test2
